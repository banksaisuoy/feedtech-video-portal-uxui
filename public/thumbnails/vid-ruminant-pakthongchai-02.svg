<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="grad_bg_361" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="60%" stop-color="#115e59"/>
      <stop offset="100%" stop-color="#050a0e"/>
    </linearGradient>

    <linearGradient id="grad_badge_361" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>

    <linearGradient id="grad_accent_361" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>

    <pattern id="grid_361" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.04"/>
    </pattern>

    <filter id="glow_361" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1280" height="720" fill="url(#grad_bg_361)"/>
  <rect width="1280" height="720" fill="url(#grid_361)"/>

  <!-- Ambient Glow Circles -->
  <circle cx="1080" cy="220" r="320" fill="#2dd4bf" opacity="0.28" filter="url(#glow_361)"/>
  <circle cx="200" cy="620" r="280" fill="#0d9488" opacity="0.18" filter="url(#glow_361)"/>

  <!-- Abstract Graphic Element in Background -->
  <g opacity="0.12" transform="translate(860, 160)">
    <circle cx="160" cy="160" r="180" stroke="#2dd4bf" stroke-width="4" stroke-dasharray="16 12"/>
    <circle cx="160" cy="160" r="130" stroke="#ffffff" stroke-width="2"/>
    <circle cx="160" cy="160" r="70" fill="#2dd4bf"/>
    <text x="160" y="195" font-size="96" text-anchor="middle" fill="#ffffff">📍</text>
  </g>

  <!-- Top Bar Badges -->
  <g transform="translate(90, 80)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="280" height="42" rx="21" fill="url(#grad_badge_361)" />
    <text x="20" y="27" font-size="15" font-weight="800" fill="#ffffff" letter-spacing="1">📍  PAKTHONGCHAI STATION</text>

    <!-- Platform Pill -->
    <rect x="295" y="0" width="160" height="42" rx="21" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>
    <text x="315" y="27" font-size="14" font-weight="700" fill="#cbd5e1" letter-spacing="0.5">FEEDTECH HQ</text>
  </g>

  <!-- Video Title -->
  <g>
    <text x="90" y="270" fill="#ffffff" font-size="44" font-weight="800" letter-spacing="-0.5">Pakthongchai Silage Innovations:</text>
        <text x="90" y="326" fill="#ffffff" font-size="44" font-weight="800" letter-spacing="-0.5">Napier Pakchong 1 Ensiling</text>
        <text x="90" y="382" fill="#ffffff" font-size="44" font-weight="800" letter-spacing="-0.5">Dynamics</text>
  </g>

  <!-- Presenter & Department Meta -->
  <g transform="translate(90, 520)">
    <!-- Speaker Info -->
    <circle cx="24" cy="24" r="24" fill="#2dd4bf" fill-opacity="0.3" stroke="#2dd4bf" stroke-width="2"/>
    <text x="24" y="32" font-size="20" text-anchor="middle" fill="#ffffff">👤</text>
    
    <text x="64" y="20" font-size="18" font-weight="700" fill="#f1f5f9">Agronomy Research Station</text>
    <text x="64" y="42" font-size="14" font-weight="500" fill="#94a3b8">Pakthongchai Research Station</text>
  </g>

  <!-- Duration Badge (Bottom Right) -->
  <g transform="translate(1080, 590)">
    <rect x="0" y="0" width="110" height="42" rx="10" fill="#000000" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>
    <text x="55" y="27" font-size="16" font-weight="800" text-anchor="middle" fill="#f8fafc" letter-spacing="1">⏱️ 31:50</text>
  </g>

  <!-- Bottom Brand Gradient Line -->
  <rect x="0" y="712" width="1280" height="8" fill="url(#grad_accent_361)"/>
</svg>