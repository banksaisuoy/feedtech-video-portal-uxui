<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="grad_bg_303" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c0519"/>
      <stop offset="60%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#050a0e"/>
    </linearGradient>

    <linearGradient id="grad_badge_303" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <linearGradient id="grad_accent_303" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <pattern id="grid_303" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.04"/>
    </pattern>

    <filter id="glow_303" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1280" height="720" fill="url(#grad_bg_303)"/>
  <rect width="1280" height="720" fill="url(#grid_303)"/>

  <!-- Ambient Glow Circles -->
  <circle cx="1080" cy="220" r="320" fill="#f43f5e" opacity="0.28" filter="url(#glow_303)"/>
  <circle cx="200" cy="620" r="280" fill="#e11d48" opacity="0.18" filter="url(#glow_303)"/>

  <!-- Abstract Graphic Element in Background -->
  <g opacity="0.12" transform="translate(860, 160)">
    <circle cx="160" cy="160" r="180" stroke="#f43f5e" stroke-width="4" stroke-dasharray="16 12"/>
    <circle cx="160" cy="160" r="130" stroke="#ffffff" stroke-width="2"/>
    <circle cx="160" cy="160" r="70" fill="#f43f5e"/>
    <text x="160" y="195" font-size="96" text-anchor="middle" fill="#ffffff">🐖</text>
  </g>

  <!-- Top Bar Badges -->
  <g transform="translate(90, 80)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="324" height="42" rx="21" fill="url(#grad_badge_303)" />
    <text x="20" y="27" font-size="15" font-weight="800" fill="#ffffff" letter-spacing="1">🐖  SWINE NUTRITION & HEALTH</text>

    <!-- Platform Pill -->
    <rect x="339" y="0" width="160" height="42" rx="21" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>
    <text x="359" y="27" font-size="14" font-weight="700" fill="#cbd5e1" letter-spacing="0.5">FEEDTECH HQ</text>
  </g>

  <!-- Video Title -->
  <g>
    <text x="90" y="300" fill="#ffffff" font-size="44" font-weight="800" letter-spacing="-0.5">Automated Liquid Feeding Systems</text>
        <text x="90" y="356" fill="#ffffff" font-size="44" font-weight="800" letter-spacing="-0.5">in Commercial Grow-Finish Units</text>
  </g>

  <!-- Presenter & Department Meta -->
  <g transform="translate(90, 520)">
    <!-- Speaker Info -->
    <circle cx="24" cy="24" r="24" fill="#f43f5e" fill-opacity="0.3" stroke="#f43f5e" stroke-width="2"/>
    <text x="24" y="32" font-size="20" text-anchor="middle" fill="#ffffff">👤</text>
    
    <text x="64" y="20" font-size="18" font-weight="700" fill="#f1f5f9">Klaus Webber</text>
    <text x="64" y="42" font-size="14" font-weight="500" fill="#94a3b8">Veterinary &amp; Animal Health</text>
  </g>

  <!-- Duration Badge (Bottom Right) -->
  <g transform="translate(1080, 590)">
    <rect x="0" y="0" width="110" height="42" rx="10" fill="#000000" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>
    <text x="55" y="27" font-size="16" font-weight="800" text-anchor="middle" fill="#f8fafc" letter-spacing="1">⏱️ 24:30</text>
  </g>

  <!-- Bottom Brand Gradient Line -->
  <rect x="0" y="712" width="1280" height="8" fill="url(#grad_accent_303)"/>
</svg>